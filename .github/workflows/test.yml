name: Test action

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Test action
        uses: ./
        with:
          version: v1.0.0

      - name: Run smoke test
        run: make -C smoke-test check
