name: Track upstream versions

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Load current pinned versions
        id: current
        run: |
          source versions.env
          echo "sdk-tag=$SDK_TAG"             >> "$GITHUB_OUTPUT"
          echo "toolchain-url=$TOOLCHAIN_URL" >> "$GITHUB_OUTPUT"
          echo "bundle-version=$BUNDLE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check gitee for new SDK tags
        id: sdk
        run: |
          set -euo pipefail
          TAGS=$(curl -fsSL "https://gitee.com/api/v5/repos/Jieli-Tech/fw-AC79_AIoT_SDK/tags?per_page=100")
          LATEST=$(echo "$TAGS" | jq -r '.[0].name')
          CURRENT="${{ steps.current.outputs.sdk-tag }}"
          echo "Current SDK: $CURRENT"
          echo "Latest SDK:  $LATEST"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$LATEST" != "$CURRENT" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check toolchain for updates
        id: toolchain
        run: |
          set -euo pipefail
          mkdir -p /tmp/tc-check
          curl -fsSL --retry 3 "${{ steps.current.outputs.toolchain-url }}" \
            | tar -xJ -C /tmp/tc-check
          NEW_DIR=$(ls -d /tmp/tc-check/jieli-linux-toolchains-* | sort | tail -1)
          NEW_VERSION=$(basename "$NEW_DIR" | sed 's/jieli-linux-toolchains-//')
          rm -rf /tmp/tc-check

          CURRENT_VERSION=""
          if BODY=$(gh release view latest --json body -q .body 2>/dev/null); then
            CURRENT_VERSION=$(echo "$BODY" | grep -oP 'Toolchain: \K\S+' || true)
          fi

          echo "Current toolchain: ${CURRENT_VERSION:-unknown}"
          echo "Latest toolchain:  $NEW_VERSION"
          echo "latest=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$NEW_VERSION" != "$CURRENT_VERSION" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create update PR
        if: steps.sdk.outputs.new == 'true' || steps.toolchain.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="auto/upstream-update-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"

          if [ "${{ steps.sdk.outputs.new }}" = "true" ]; then
            NEW_TAG="${{ steps.sdk.outputs.latest }}"
            sed -i "s/^SDK_TAG=.*/SDK_TAG=$NEW_TAG/" versions.env
            sed -i "s/^SDK_COMMIT=.*/SDK_COMMIT=NEEDS_VERIFICATION/" versions.env
          fi

          source versions.env
          MAJOR=$(echo "$BUNDLE_VERSION" | cut -d. -f1)
          MINOR=$(echo "$BUNDLE_VERSION" | cut -d. -f2)
          NEW_BUNDLE="$MAJOR.$((MINOR + 1)).0"
          sed -i "s/^BUNDLE_VERSION=.*/BUNDLE_VERSION=$NEW_BUNDLE/" versions.env

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add versions.env
          git commit -m "chore: bump upstream versions

          SDK: ${{ steps.sdk.outputs.latest }}
          Toolchain: ${{ steps.toolchain.outputs.latest }}"

          git push origin "$BRANCH"

          gh pr create \
            --title "chore: upstream update $(date +%Y-%m-%d)" \
            --body "$(cat <<'PREOF'
          Upstream version update detected.

          **SDK:** ${{ steps.current.outputs.sdk-tag }} -> ${{ steps.sdk.outputs.latest }} (new: ${{ steps.sdk.outputs.new }})
          **Toolchain:** ${{ steps.toolchain.outputs.latest }} (new: ${{ steps.toolchain.outputs.new }})

          After merging, tag \`v${NEW_BUNDLE}\` to trigger packaging.
          PREOF
          )" \
            --base main \
            --head "$BRANCH"
