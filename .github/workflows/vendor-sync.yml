name: Vendor sync

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-publish even if versions already mirrored'
        type: boolean
        default: false
      sdk-count:
        description: 'Number of recent SDK versions to mirror'
        type: number
        default: 3
      toolchain-count:
        description: 'Number of recent toolchain versions to mirror'
        type: number
        default: 1

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      sdk-matrix: ${{ steps.sdk.outputs.matrix }}
      toolchain-matrix: ${{ steps.toolchain.outputs.matrix }}
    steps:
      - name: Discover SDK versions
        id: sdk
        run: |
          set -euo pipefail
          COUNT="${{ inputs.sdk-count || 3 }}"
          SDK_URL="https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK"
          SDK_REPO_PATH=$(echo "$SDK_URL" | sed 's|https://gitee.com/||')

          TAGS=$(curl -fsSL "https://gitee.com/api/v5/repos/${SDK_REPO_PATH}/tags?per_page=100")

          MATRIX=$(echo "$TAGS" | jq -c --argjson count "$COUNT" '
            [ .[] | {
              tag: .name,
              version: (.name | sub("^AC79NN_SDK_V"; "")),
              date: .commit.date
            } ]
            | sort_by(.date)
            | reverse
            | .[:$count]
            | { include: [ .[] | {
                version: .version,
                tag: .tag,
                url: "https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK"
              } ] }
          ')

          echo "SDK versions to mirror:"
          echo "$MATRIX" | jq -r '.include[].version'
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Discover toolchain versions
        id: toolchain
        run: |
          set -euo pipefail
          COUNT="${{ inputs.toolchain-count || 1 }}"
          mkdir -p /tmp/tc-check
          curl -fsSL --retry 3 "https://pkgman.jieliapp.com/s/linux-toolchain" \
            | tar -xJ -C /tmp/tc-check
          VERSION=$(ls -d /tmp/tc-check/jieli-linux-toolchains-* | sort | tail -1 | xargs basename | sed 's/jieli-linux-toolchains-//')
          rm -rf /tmp/tc-check

          MATRIX=$(jq -nc --arg ver "$VERSION" '{
            include: [{ version: $ver, url: "https://pkgman.jieliapp.com/s/linux-toolchain" }]
          }')

          echo "Toolchain versions to mirror:"
          echo "$MATRIX" | jq -r '.include[].version'
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  mirror-sdk:
    needs: discover
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.sdk-matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Check if mirror release exists with checksum
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="sdk-${{ matrix.version }}"
          ARCHIVE="sdk-${{ matrix.version }}.tar.xz"

          if gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null \
               | grep -qF "${ARCHIVE}.sha256"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Mirror release $TAG exists with checksum, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Mirror release $TAG missing or no checksum, will download"
          fi

      - name: Delete existing release (force)
        if: inputs.force && steps.exists.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "sdk-${{ matrix.version }}" --repo "${{ github.repository }}" --cleanup-tag --yes

      - name: Download and publish SDK
        if: steps.exists.outputs.exists != 'true' || inputs.force
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_TAG: ${{ matrix.tag }}
          SDK_URL: ${{ matrix.url }}
          SDK_VER: ${{ matrix.version }}
        run: |
          set -euo pipefail
          url="${SDK_URL}/repository/archive/${SDK_TAG}.zip"
          echo "[sdk] Downloading $SDK_VER from: $url"
          mkdir -p /tmp/sdk-work
          for i in 1 2 3; do
            curl -fSL --retry 3 -o /tmp/sdk-work/sdk.zip "$url" && break
            echo "[sdk] Attempt $i failed, retrying in 20s..."
            rm -f /tmp/sdk-work/sdk.zip
            sleep 20
          done
          test -f /tmp/sdk-work/sdk.zip || { echo "::error::SDK download failed"; exit 1; }

          echo "[sdk] Origin checksum (upstream zip):"
          (cd /tmp/sdk-work && sha256sum sdk.zip | tee origin.sha256)

          unzip -q /tmp/sdk-work/sdk.zip -d /tmp/sdk-work/raw
          SDK_DIR=$(ls -d /tmp/sdk-work/raw/*/ | head -1)
          mv "$SDK_DIR" /tmp/sdk-work/sdk

          ARCHIVE="sdk-${SDK_VER}.tar.xz"
          cd /tmp/sdk-work
          tar -cf - sdk | xz -T0 > "$ARCHIVE"
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          echo "[sdk] Archive checksum:"
          cat "${ARCHIVE}.sha256"

          echo "[sdk] Verifying archive integrity..."
          mkdir -p /tmp/sdk-verify
          tar -xJf "$ARCHIVE" -C /tmp/sdk-verify
          test -f /tmp/sdk-verify/sdk/Makefile \
            || { echo "::error::SDK archive verification failed: Makefile missing"; exit 1; }
          rm -rf /tmp/sdk-verify
          echo "[sdk] Archive verified"

          RELEASE_TAG="sdk-${SDK_VER}"
          gh release create "$RELEASE_TAG" \
            "$ARCHIVE" "${ARCHIVE}.sha256" \
            --repo "${{ github.repository }}" \
            --prerelease \
            --title "SDK ${SDK_VER} (mirror)" \
            --notes "$(cat <<EOF
          **Mirror of JieLi AC79 AIoT SDK ${SDK_VER}**

          This is a 1:1 copy of the upstream SDK, provided for convenience of download
          by the [setup-fm1-toolchain](https://github.com/${{ github.repository }}) GitHub Action.

          **Source:** [\`${SDK_TAG}\`](${SDK_URL}/releases/tag/${SDK_TAG})
          **Origin SHA256 (upstream zip):** \`$(cut -d' ' -f1 origin.sha256)\`
          **Archive SHA256 (tar.xz):** \`$(cut -d' ' -f1 "${ARCHIVE}.sha256")\`
          EOF
          )"
          echo "[sdk] Published release $RELEASE_TAG"

      - name: Attest SDK release
        if: steps.exists.outputs.exists != 'true' || inputs.force
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            /tmp/sdk-work/sdk-${{ matrix.version }}.tar.xz

  mirror-toolchain:
    needs: discover
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.toolchain-matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Check if mirror release exists with checksum
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="toolchain-${{ matrix.version }}"
          ARCHIVE="toolchain-${{ matrix.version }}.tar.xz"

          if gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null \
               | grep -qF "${ARCHIVE}.sha256"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Mirror release $TAG exists with checksum, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Mirror release $TAG missing or no checksum, will download"
          fi

      - name: Delete existing release (force)
        if: inputs.force && steps.exists.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "toolchain-${{ matrix.version }}" --repo "${{ github.repository }}" --cleanup-tag --yes

      - name: Download and publish toolchain
        if: steps.exists.outputs.exists != 'true' || inputs.force
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN_URL: ${{ matrix.url }}
          TC_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          echo "[toolchain] Downloading from: $TOOLCHAIN_URL"
          mkdir -p /tmp/tc-work/raw
          curl -fSL --retry 3 -o /tmp/tc-work/upstream.tar.xz "$TOOLCHAIN_URL"

          echo "[toolchain] Origin checksum (upstream tar.xz):"
          (cd /tmp/tc-work && sha256sum upstream.tar.xz | tee origin.sha256)

          tar -xJf /tmp/tc-work/upstream.tar.xz -C /tmp/tc-work/raw
          TC_DIR=$(ls -d /tmp/tc-work/raw/jieli-linux-toolchains-* | sort | tail -1)
          mv "$TC_DIR" /tmp/tc-work/toolchain
          rm /tmp/tc-work/upstream.tar.xz

          ARCHIVE="toolchain-${TC_VERSION}.tar.xz"
          cd /tmp/tc-work
          tar -cf - toolchain | xz -T0 > "$ARCHIVE"
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          echo "[toolchain] Archive checksum:"
          cat "${ARCHIVE}.sha256"

          echo "[toolchain] Verifying archive integrity..."
          mkdir -p /tmp/tc-verify
          tar -xJf "$ARCHIVE" -C /tmp/tc-verify
          test -x /tmp/tc-verify/toolchain/pi32v2/bin/clang \
            || { echo "::error::Toolchain archive verification failed: clang missing or not executable"; exit 1; }
          rm -rf /tmp/tc-verify
          echo "[toolchain] Archive verified"

          RELEASE_TAG="toolchain-${TC_VERSION}"
          gh release create "$RELEASE_TAG" \
            "$ARCHIVE" "${ARCHIVE}.sha256" \
            --repo "${{ github.repository }}" \
            --prerelease \
            --title "Toolchain ${TC_VERSION} (mirror)" \
            --notes "$(cat <<EOF
          **Mirror of JieLi Linux Toolchain ${TC_VERSION}**

          This is a 1:1 copy of the upstream toolchain, provided for convenience of download
          by the [setup-fm1-toolchain](https://github.com/${{ github.repository }}) GitHub Action.

          **Source:** $TOOLCHAIN_URL
          **Origin SHA256 (upstream tar.xz):** \`$(cut -d' ' -f1 origin.sha256)\`
          **Archive SHA256 (tar.xz):** \`$(cut -d' ' -f1 "${ARCHIVE}.sha256")\`
          EOF
          )"
          echo "[toolchain] Published release $RELEASE_TAG"

      - name: Attest toolchain release
        if: steps.exists.outputs.exists != 'true' || inputs.force
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            /tmp/tc-work/toolchain-${{ matrix.version }}.tar.xz

  smoke-test:
    needs: [mirror-sdk, mirror-toolchain]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Test action with defaults
        uses: ./
