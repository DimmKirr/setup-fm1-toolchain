name: Vendor sync

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-publish even if versions already mirrored'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set upstream sources
        id: current
        run: |
          echo "sdk-url=https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK" >> "$GITHUB_OUTPUT"
          echo "toolchain-url=https://pkgman.jieliapp.com/s/linux-toolchain" >> "$GITHUB_OUTPUT"

      # ── Check upstream ─────────────────────────────────────────────

      - name: Detect latest SDK tag
        id: sdk
        run: |
          set -euo pipefail
          SDK_URL="${{ steps.current.outputs.sdk-url }}"
          SDK_REPO_PATH=$(echo "$SDK_URL" | sed 's|https://gitee.com/||')
          TAGS=$(curl -fsSL "https://gitee.com/api/v5/repos/${SDK_REPO_PATH}/tags?per_page=100")
          LATEST=$(echo "$TAGS" | jq -r '.[-1].name')
          LATEST_VER=$(echo "$LATEST" | sed 's/^AC79NN_SDK_V//')

          echo "Latest SDK: $LATEST ($LATEST_VER)"
          echo "latest-tag=$LATEST"       >> "$GITHUB_OUTPUT"
          echo "latest-ver=$LATEST_VER"   >> "$GITHUB_OUTPUT"

      - name: Detect latest toolchain version
        id: toolchain
        run: |
          set -euo pipefail
          mkdir -p /tmp/tc-check
          curl -fsSL --retry 3 "${{ steps.current.outputs.toolchain-url }}" \
            | tar -xJ -C /tmp/tc-check
          NEW_DIR=$(ls -d /tmp/tc-check/jieli-linux-toolchains-* | sort | tail -1)
          NEW_VERSION=$(basename "$NEW_DIR" | sed 's/jieli-linux-toolchains-//')
          rm -rf /tmp/tc-check

          echo "Latest toolchain: $NEW_VERSION"
          echo "latest=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      # ── Mirror SDK ─────────────────────────────────────────────────

      - name: Check if SDK mirror release exists
        id: sdk-exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="sdk-${{ steps.sdk.outputs.latest-ver }}"
          if gh release view "$TAG" --json tagName -q .tagName >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete existing SDK release (force)
        if: inputs.force && steps.sdk-exists.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "sdk-${{ steps.sdk.outputs.latest-ver }}" --repo "${{ github.repository }}" --cleanup-tag --yes

      - name: Download and publish SDK
        if: steps.sdk-exists.outputs.exists != 'true' || inputs.force
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_TAG: ${{ steps.sdk.outputs.latest-tag }}
          SDK_URL: ${{ steps.current.outputs.sdk-url }}
          SDK_VER: ${{ steps.sdk.outputs.latest-ver }}
        run: |
          set -euo pipefail
          url="${SDK_URL}/repository/archive/${SDK_TAG}.zip"
          echo "[sdk] Downloading from: $url"
          mkdir -p /tmp/sdk-work
          for i in 1 2 3; do
            curl -fSL --retry 3 -o /tmp/sdk-work/sdk.zip "$url" && break
            echo "[sdk] Attempt $i failed, retrying in 20s..."
            rm -f /tmp/sdk-work/sdk.zip
            sleep 20
          done
          test -f /tmp/sdk-work/sdk.zip || { echo "::error::SDK download failed"; exit 1; }

          echo "[sdk] Origin checksum (upstream zip):"
          (cd /tmp/sdk-work && sha256sum sdk.zip | tee origin.sha256)

          unzip -q /tmp/sdk-work/sdk.zip -d /tmp/sdk-work/raw
          SDK_DIR=$(ls -d /tmp/sdk-work/raw/*/ | head -1)
          mv "$SDK_DIR" /tmp/sdk-work/sdk

          ARCHIVE="sdk-${SDK_VER}.tar.xz"
          cd /tmp/sdk-work
          tar -cf - sdk | xz -T0 > "$ARCHIVE"
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          echo "[sdk] Archive checksum:"
          cat "${ARCHIVE}.sha256"

          echo "[sdk] Verifying archive integrity..."
          mkdir -p /tmp/sdk-verify
          tar -xJf "$ARCHIVE" -C /tmp/sdk-verify
          test -f /tmp/sdk-verify/sdk/Makefile \
            || { echo "::error::SDK archive verification failed: Makefile missing"; exit 1; }
          rm -rf /tmp/sdk-verify
          echo "[sdk] Archive verified"

          RELEASE_TAG="sdk-${SDK_VER}"
          gh release create "$RELEASE_TAG" \
            "$ARCHIVE" "${ARCHIVE}.sha256" \
            --repo "${{ github.repository }}" \
            --prerelease \
            --title "SDK ${SDK_VER} (mirror)" \
            --notes "$(cat <<EOF
          **Mirror of JieLi AC79 AIoT SDK ${SDK_VER}**

          This is a 1:1 copy of the upstream SDK, provided for convenience of download
          by the [setup-fm1-toolchain](https://github.com/${{ github.repository }}) GitHub Action.

          **Source:** [\`${SDK_TAG}\`](${SDK_URL}/releases/tag/${SDK_TAG})
          **Origin SHA256 (upstream zip):** \`$(cut -d' ' -f1 origin.sha256)\`
          **Archive SHA256 (tar.xz):** \`$(cut -d' ' -f1 "${ARCHIVE}.sha256")\`
          EOF
          )"
          echo "[sdk] Published release $RELEASE_TAG"

      - name: Attest SDK release
        if: steps.sdk-exists.outputs.exists != 'true' || inputs.force
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            /tmp/sdk-work/sdk-${{ steps.sdk.outputs.latest-ver }}.tar.xz

      # ── Mirror toolchain ───────────────────────────────────────────

      - name: Check if toolchain mirror release exists
        id: tc-exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="toolchain-${{ steps.toolchain.outputs.latest }}"
          if gh release view "$TAG" --json tagName -q .tagName >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete existing toolchain release (force)
        if: inputs.force && steps.tc-exists.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "toolchain-${{ steps.toolchain.outputs.latest }}" --repo "${{ github.repository }}" --cleanup-tag --yes

      - name: Download and publish toolchain
        if: steps.tc-exists.outputs.exists != 'true' || inputs.force
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN_URL: ${{ steps.current.outputs.toolchain-url }}
          TC_VERSION: ${{ steps.toolchain.outputs.latest }}
        run: |
          set -euo pipefail
          echo "[toolchain] Downloading from: $TOOLCHAIN_URL"
          mkdir -p /tmp/tc-work/raw
          curl -fSL --retry 3 -o /tmp/tc-work/upstream.tar.xz "$TOOLCHAIN_URL"

          echo "[toolchain] Origin checksum (upstream tar.xz):"
          (cd /tmp/tc-work && sha256sum upstream.tar.xz | tee origin.sha256)

          tar -xJf /tmp/tc-work/upstream.tar.xz -C /tmp/tc-work/raw
          TC_DIR=$(ls -d /tmp/tc-work/raw/jieli-linux-toolchains-* | sort | tail -1)
          mv "$TC_DIR" /tmp/tc-work/toolchain
          rm /tmp/tc-work/upstream.tar.xz

          ARCHIVE="toolchain-${TC_VERSION}.tar.xz"
          cd /tmp/tc-work
          tar -cf - toolchain | xz -T0 > "$ARCHIVE"
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          echo "[toolchain] Archive checksum:"
          cat "${ARCHIVE}.sha256"

          echo "[toolchain] Verifying archive integrity..."
          mkdir -p /tmp/tc-verify
          tar -xJf "$ARCHIVE" -C /tmp/tc-verify
          test -x /tmp/tc-verify/toolchain/pi32v2/bin/clang \
            || { echo "::error::Toolchain archive verification failed: clang missing or not executable"; exit 1; }
          rm -rf /tmp/tc-verify
          echo "[toolchain] Archive verified"

          RELEASE_TAG="toolchain-${TC_VERSION}"
          gh release create "$RELEASE_TAG" \
            "$ARCHIVE" "${ARCHIVE}.sha256" \
            --repo "${{ github.repository }}" \
            --prerelease \
            --title "Toolchain ${TC_VERSION} (mirror)" \
            --notes "$(cat <<EOF
          **Mirror of JieLi Linux Toolchain ${TC_VERSION}**

          This is a 1:1 copy of the upstream toolchain, provided for convenience of download
          by the [setup-fm1-toolchain](https://github.com/${{ github.repository }}) GitHub Action.

          **Source:** $TOOLCHAIN_URL
          **Origin SHA256 (upstream tar.xz):** \`$(cut -d' ' -f1 origin.sha256)\`
          **Archive SHA256 (tar.xz):** \`$(cut -d' ' -f1 "${ARCHIVE}.sha256")\`
          EOF
          )"
          echo "[toolchain] Published release $RELEASE_TAG"

      - name: Attest toolchain release
        if: steps.tc-exists.outputs.exists != 'true' || inputs.force
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            /tmp/tc-work/toolchain-${{ steps.toolchain.outputs.latest }}.tar.xz

      # ── Smoke test ─────────────────────────────────────────────────

      - name: Smoke test
        run: |
          set -euo pipefail
          SDK_PATH=/tmp/sdk-work/sdk
          TC_PATH=/tmp/tc-work/toolchain

          if [ ! -d "$SDK_PATH" ] || [ ! -d "$TC_PATH" ]; then
            echo "Skipping smoke test — artifacts were not downloaded (mirror releases already exist)"
            exit 0
          fi

          export JIELI_TOOLCHAIN="$TC_PATH"
          export AC79_SDK="$SDK_PATH"
          make -C smoke-test check

