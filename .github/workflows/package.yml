name: Release action

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - sdk-version: '1.2.14'
            toolchain-version: '20260730.1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install toolchain from mirror releases
        uses: ./
        with:
          sdk-version: ${{ matrix.sdk-version }}
          toolchain-version: ${{ matrix.toolchain-version }}

      - name: Smoke test
        run: make -C smoke-test check

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "FM1 Toolchain Action ${{ steps.version.outputs.version }}" \
            --notes "$(cat <<'EOF'
          **setup-fm1-toolchain** action release.

          ```yaml
          - uses: dimmkirr/setup-fm1-toolchain@v1
          ```

          SDK and toolchain binaries are downloaded from separate mirror releases
          (see pre-releases). Override versions with `sdk-version` / `toolchain-version` inputs.
          EOF
          )"

      - name: Update major version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAJOR=$(echo "$GITHUB_REF_NAME" | grep -oP '^v\d+')
          gh api -X PATCH repos/${{ github.repository }}/git/refs/tags/"$MAJOR" \
            -f sha="$(git rev-parse HEAD)" -F force=true 2>/dev/null \
          || gh api -X POST repos/${{ github.repository }}/git/refs \
            -f ref="refs/tags/$MAJOR" -f sha="$(git rev-parse HEAD)"
