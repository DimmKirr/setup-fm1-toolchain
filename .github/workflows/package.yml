name: Package toolchain bundle

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Load pinned versions
        run: |
          set -euo pipefail
          source versions.env
          echo "SDK_TAG=$SDK_TAG"               >> "$GITHUB_ENV"
          echo "SDK_REPO=$SDK_REPO"             >> "$GITHUB_ENV"
          echo "TOOLCHAIN_URL=$TOOLCHAIN_URL"   >> "$GITHUB_ENV"
          echo "BUNDLE_VERSION=$BUNDLE_VERSION" >> "$GITHUB_ENV"

      - name: Download SDK and toolchain in parallel
        run: |
          set -euo pipefail

          download_sdk() {
            url="https://gitee.com/${SDK_REPO}/repository/archive/${SDK_TAG}.zip"
            echo "[sdk] Downloading from: $url"
            for i in 1 2 3; do
              curl -fSL --retry 3 -o sdk.zip "$url" && break
              echo "[sdk] Attempt $i failed, retrying in 20s..."
              rm -f sdk.zip
              sleep 20
            done
            test -f sdk.zip || { echo "[sdk] Download failed"; exit 1; }
            unzip -q sdk.zip -d sdk-raw
            SDK_DIR=$(ls -d sdk-raw/*/ | head -1)
            mv "$SDK_DIR" sdk
            rm -rf sdk-raw sdk.zip
            echo "[sdk] Done: $(ls sdk/ | head -5)"
          }

          download_toolchain() {
            echo "[toolchain] Downloading from: $TOOLCHAIN_URL"
            mkdir -p toolchain-raw
            curl -fSL --retry 3 "$TOOLCHAIN_URL" | tar -xJ -C toolchain-raw
            TC_DIR=$(ls -d toolchain-raw/jieli-linux-toolchains-* | sort | tail -1)
            mv "$TC_DIR" toolchain
            rm -rf toolchain-raw
            TC_VERSION=$(echo "$TC_DIR" | grep -oP 'jieli-linux-toolchains-\K.*' || echo "unknown")
            echo "$TC_VERSION" > /tmp/tc-version
            echo "[toolchain] Done: $TC_VERSION"
          }

          download_sdk &
          download_toolchain &
          wait

          TC_VERSION=$(cat /tmp/tc-version)
          echo "TOOLCHAIN_ACTUAL_VERSION=$TC_VERSION" >> "$GITHUB_ENV"

      - name: Derive SDK short version
        run: |
          set -euo pipefail
          SDK_SHORT=$(echo "$SDK_TAG" | grep -oP 'V\K[0-9]+\.[0-9]+\.[0-9]+' || echo "unknown")
          echo "SDK_SHORT=$SDK_SHORT" >> "$GITHUB_ENV"

      - name: Assemble bundle directory
        run: |
          set -euo pipefail
          BUNDLE_NAME="fm1-toolchain-${BUNDLE_VERSION}-sdk${SDK_SHORT}-tc${TOOLCHAIN_ACTUAL_VERSION}"
          mkdir -p "$BUNDLE_NAME"
          mv sdk "$BUNDLE_NAME/AC79_SDK"
          mv toolchain "$BUNDLE_NAME/toolchain"
          cp versions.env "$BUNDLE_NAME/"
          echo "TOOLCHAIN_ACTUAL_VERSION=$TOOLCHAIN_ACTUAL_VERSION" >> "$BUNDLE_NAME/versions.env"
          echo "PACKAGED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$BUNDLE_NAME/versions.env"
          echo "BUNDLE_NAME=$BUNDLE_NAME" >> "$GITHUB_ENV"

      - name: Smoke test before packaging
        run: |
          set -euo pipefail
          export JIELI_TOOLCHAIN="$(pwd)/$BUNDLE_NAME/toolchain/pi32v2"
          export AC79_SDK="$(pwd)/$BUNDLE_NAME/AC79_SDK"
          make -C smoke-test check

      - name: Bundle into tar.xz
        run: |
          set -euo pipefail
          tar -cf - "$BUNDLE_NAME" | xz -T0 > "${BUNDLE_NAME}.tar.xz"
          sha256sum "${BUNDLE_NAME}.tar.xz" | tee SHA256SUMS
          echo "BUNDLE_FILE=${BUNDLE_NAME}.tar.xz" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$BUNDLE_FILE" SHA256SUMS \
            --title "FM1 Toolchain $BUNDLE_VERSION (SDK $SDK_SHORT / Toolchain $TOOLCHAIN_ACTUAL_VERSION)" \
            --notes "**SDK:** \`$SDK_TAG\` (v$SDK_SHORT)
          **Toolchain:** \`$TOOLCHAIN_ACTUAL_VERSION\`

          \`\`\`yaml
          - uses: dimmkirr/setup-fm1-toolchain@v1
          \`\`\`"

      - name: Attest release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ env.BUNDLE_FILE }}
            SHA256SUMS

      - name: Update major version tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAJOR=$(echo "$GITHUB_REF_NAME" | grep -oP '^v\d+')
          gh api -X PATCH repos/${{ github.repository }}/git/refs/tags/"$MAJOR" \
            -f sha="$(git rev-parse HEAD)" -F force=true 2>/dev/null \
          || gh api -X POST repos/${{ github.repository }}/git/refs \
            -f ref="refs/tags/$MAJOR" -f sha="$(git rev-parse HEAD)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fm1-toolchain-bundle
          path: |
            fm1-toolchain-*.tar.xz
            SHA256SUMS
          if-no-files-found: error
